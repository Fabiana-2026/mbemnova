<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>MbemLevel · Quiz Angular 22 et Spring Boot</title><meta property="og:type" content="website"><meta property="og:title" content="Quiz Angular 22 et Spring Boot · MbemLevel"><meta property="og:description" content="Angular 22, Spring Boot 4.1, JPA, sécurité, full-stack. Teste ton niveau et partage ton score !"><meta name="theme-color" content="#4a45b0">
<style>
:root{--bg:#0b1220;--cd:#131c31;--tx:#e8eefc;--mu:#93a1c4;--ac:#a5a8f5;--pr:#4a45b0;--ok:#22c55e;--a2:#818cf8;--bad:#ff5a6e;--ln:#26324f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f1f5fd;--cd:#fff;--tx:#0b1220;--mu:#51608a;--ln:#d5ddf0;--ac:#4a45b0}}
:root[data-theme="light"]{--bg:#f1f5fd;--cd:#fff;--tx:#0b1220;--mu:#51608a;--ln:#d5ddf0;--ac:#4a45b0}
*,*:before,*:after{box-sizing:inherit;min-width:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:clamp(.8rem,3.6vw,1rem)/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;overflow-wrap:anywhere}
header{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;justify-content:space-between;padding:.6rem clamp(.3rem,3vw,1.2rem)}
.lg{display:flex;align-items:center;gap:.4rem;font-weight:800;font-size:clamp(.85rem,4vw,1.2rem)}.lg img{width:2.2em;height:2.2em;flex:none}.bl{display:block;width:clamp(3rem,25vw,5rem);margin:.2rem 0}.lg b{color:var(--ac)}
button{font:inherit;color:inherit;cursor:pointer}
.sm{background:var(--cd);border:1px solid var(--ln);border-radius:99px;padding:.25rem .8rem}
main{max-width:640px;margin:0 auto;padding:.3rem clamp(.3rem,3vw,1rem) 2rem}
.cd{background:var(--cd);border:1px solid var(--ln);border-radius:1rem;padding:clamp(.5rem,3vw,1.2rem);margin:.6rem 0}
.bar{height:.6rem;background:var(--ln);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#4a45b0,#818cf8);transition:width .4s}
.st{display:flex;flex-wrap:wrap;gap:.3rem .9rem;justify-content:space-between;margin:.4rem 0;font-weight:700}
.row{display:flex;align-items:center;gap:.6rem}.row svg{width:clamp(3rem,22vw,5.5rem);flex:none}
.bb{position:relative;background:var(--cd);border:1px solid var(--ln);border-radius:1rem;padding:.5rem .8rem;flex:1}
.tag{display:inline-block;font-size:.75em;font-weight:700;color:var(--ac);border:1px solid var(--ac);border-radius:99px;padding:0 .6rem;margin-bottom:.4rem}
h1{font-size:clamp(1.1rem,6vw,2rem);line-height:1.2;margin:.3rem 0}h2{font-size:clamp(1rem,5vw,1.4rem);margin:.3rem 0}
.o{display:block;width:100%;text-align:left;background:transparent;border:2px solid var(--ln);border-radius:.8rem;padding:.6rem .8rem;margin:.4rem 0;min-height:44px;transition:.15s}
.o:hover:not(:disabled){border-color:var(--a2);transform:translateY(-1px)}
.o.g{border-color:var(--ok);background:rgba(34,197,94,.15)}.o.r{border-color:var(--bad);background:rgba(255,90,110,.15)}
.cta{display:block;width:100%;border:0;border-radius:.9rem;padding:.8rem;font-weight:800;color:#fff;background:var(--pr);box-shadow:0 4px 0 #2e2a80;margin-top:.6rem}
.cta:active{transform:translateY(3px);box-shadow:0 1px 0 #2e2a80}
.fb{border-left:5px solid var(--ok)}.fb.x{border-color:var(--bad)}
.big{font-size:clamp(2rem,14vw,3.5rem);font-weight:900;color:var(--ac);line-height:1}
.pop{animation:pop .5s}.shk{animation:shk .4s}
@keyframes pop{50%{transform:scale(1.12) rotate(-4deg)}}@keyframes shk{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
:focus-visible{outline:3px solid var(--a2);outline-offset:2px}
.by{display:block;font-size:.55em;font-weight:600;color:var(--mu);letter-spacing:.04em}
footer{max-width:640px;margin:0 auto;padding:1rem clamp(.3rem,3vw,1rem) 1.5rem;text-align:center;border-top:1px solid var(--ln);color:var(--mu);font-size:.85em}footer b{color:var(--tx)}footer a{color:var(--ac);font-weight:700}.wa{display:inline-block;margin:.5rem 0;padding:.5rem 1rem;border-radius:99px;background:#25d366;color:#06301a!important;text-decoration:none}
body{background:radial-gradient(1100px 480px at 50% -8%,rgba(129,140,248,.2),transparent 60%),var(--bg)}
header,footer{max-width:640px;margin:0 auto}
.cd{background:linear-gradient(180deg,rgba(255,255,255,.04),transparent),var(--cd);box-shadow:0 1px 0 rgba(255,255,255,.05) inset,0 14px 30px -20px rgba(0,0,0,.65);border-radius:1.1rem}
.o{display:flex;gap:.7rem;align-items:center;background:rgba(255,255,255,.02)}
.o .k{flex:none;display:grid;place-items:center;width:1.9em;height:1.9em;border-radius:.55em;border:1.5px solid var(--ln);font-weight:800;font-size:.85em;color:var(--mu)}
.o.g .k{background:var(--ok);border-color:var(--ok);color:#052e16}.o.r .k{background:var(--bad);border-color:var(--bad);color:#fff}
.lvc{font-size:.7em;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--ac);border:1px solid var(--ln);border-radius:99px;padding:.1rem .6rem}
.bar{height:.5rem}.bar i{background:linear-gradient(90deg,#4a45b0,#818cf8,#a5a8f5)}
.sc{position:relative;overflow:hidden;border-radius:1.4rem;padding:1.3rem;margin:.6rem 0;background:linear-gradient(145deg,#16153f,#4a45b0 60%,#6d68e0);color:#fff;border:1px solid rgba(255,255,255,.18)}
.sc:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(135deg,rgba(255,255,255,.04) 0 1px,transparent 1px 14px);pointer-events:none}
.sc>*{position:relative;z-index:1}.sc .tt{font-size:.7em;letter-spacing:.14em;text-transform:uppercase;opacity:.75;font-weight:700}
.sc .nm{font-size:clamp(1.1rem,5.5vw,1.6rem);font-weight:900;line-height:1.15;margin:.3rem 0 .8rem}
.sc .ring{display:flex;align-items:center;gap:1rem}.sc svg.rg{width:7.5rem;flex:none}
.sc .gr{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem;margin-top:1rem}
.sc .gr div{background:rgba(255,255,255,.12);border-radius:.8rem;padding:.5rem;text-align:center;font-size:.72em}.sc .gr b{display:block;font-size:1.5em}
.sc .ft{display:flex;justify-content:space-between;margin-top:1rem;font-size:.7em;opacity:.8;font-weight:700}
.ghost{display:block;width:100%;background:transparent;border:2px solid var(--ln);border-radius:.9rem;padding:.7rem;font-weight:700;margin-top:.5rem}
body:before,body:after{content:"";position:fixed;z-index:-1;width:60vmax;height:60vmax;border-radius:50%;filter:blur(70px);opacity:.35;pointer-events:none}
body:before{left:-20vmax;top:-20vmax;background:#4a45b0;animation:orb 16s ease-in-out infinite alternate}
body:after{right:-25vmax;bottom:-25vmax;background:#22c55e;opacity:.14;animation:orb 20s ease-in-out infinite alternate-reverse}
@keyframes orb{to{transform:translate(12vmax,8vmax) scale(1.2)}}
@keyframes up{from{opacity:0;transform:translateY(18px) scale(.97)}}
@keyframes glow{0%{box-shadow:0 0 0 0 rgba(34,197,94,.7)}100%{box-shadow:0 0 0 18px rgba(34,197,94,0)}}
@keyframes sh{to{transform:translateX(100%)}}@keyframes hb{50%{transform:scale(1.18)}}@keyframes fl{to{transform:scale(1.25) rotate(-8deg)}}
@keyframes rg{from{stroke-dashoffset:327}}@keyframes tx{to{background-position:200% 0}}@keyframes fy{50%{transform:translateY(-6px) rotate(2deg)}}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-30px) scale(.8)}12%,80%{opacity:1;transform:translate(-50%,0) scale(1)}100%{opacity:0;transform:translate(-50%,-10px)}}
@keyframes cin{from{opacity:0;transform:scale(.88) rotate(-2deg)}}
.fresh .cd,.fresh .st,.fresh .row{animation:up .55s cubic-bezier(.2,.8,.2,1) both}
.fresh .o{animation:up .5s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i)*70ms + 120ms)}
.o.g{animation:glow .9s}.o:hover:not(:disabled){transform:translateX(6px);border-color:var(--a2);box-shadow:-4px 0 0 var(--a2)}
.cta{position:relative;overflow:hidden}.cta:before{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.35) 50%,transparent 70%);transform:translateX(-100%);animation:sh 3s infinite}
.hb{display:inline-block;animation:hb 1.4s infinite}.fl{display:inline-block;animation:fl .5s infinite alternate}
.bar i{position:relative;box-shadow:0 0 12px #818cf8}.bar i:after{content:"";position:absolute;right:0;top:0;bottom:0;width:2.5rem;background:linear-gradient(90deg,transparent,rgba(255,255,255,.7));animation:sh 1.6s infinite}
.row svg:not(.pop):not(.shk){animation:fy 3.2s ease-in-out infinite}
.cd h1{background:linear-gradient(90deg,var(--tx),var(--ac),var(--tx));background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:tx 6s linear infinite}
.bl{animation:fy 4s ease-in-out infinite;filter:drop-shadow(0 6px 14px rgba(129,140,248,.5))}
.sc{animation:cin .9s cubic-bezier(.2,.9,.3,1.2) both}.sc:before{content:"";position:absolute;top:0;bottom:0;width:40%;background:linear-gradient(110deg,transparent,rgba(255,255,255,.22),transparent);transform:translateX(-120%) skewX(-15deg);animation:sh 3.5s 1s infinite;z-index:2}
.rg circle:nth-child(2){animation:rg 1.5s .3s cubic-bezier(.2,.8,.2,1) both}
.toast{position:fixed;left:50%;top:4.5rem;z-index:10;background:linear-gradient(90deg,#4a45b0,#818cf8);color:#fff;font-weight:900;padding:.6rem 1.2rem;border-radius:99px;box-shadow:0 10px 30px rgba(74,69,176,.6);animation:toast 2.4s both;white-space:nowrap}

<script>
const D=`N|Dans Angular 22, quelle stratégie de détection des changements est par défaut pour une nouvelle application ?|In Angular 22, which change detection strategy is the default for a new application?|OnPush~Default (CheckAlways)~Manual~Aucune|OnPush~Default (CheckAlways)~Manual~None|OnPush ne revérifie un composant que si une entrée, un signal lu ou un événement change.|OnPush rechecks a component only when an input, a read signal or an event changes.
N|Comment déclare-t-on un composant sans NgModule ?|How do you declare a component without an NgModule?|Composant standalone avec imports dans @Component~Fichier .module.ts obligatoire~Directive structurelle seule~Pipe impur|Standalone component with imports in @Component~Mandatory .module.ts file~Structural directive alone~Impure pipe|Les composants sont standalone par défaut depuis Angular 19.|Components have been standalone by default since Angular 19.
N|Quel bloc remplace *ngFor dans le template moderne ?|Which block replaces *ngFor in modern templates?|@for avec track~@loop~@each~@foreach|@for with track~@loop~@each~@foreach|track identifie chaque élément pour éviter de recréer le DOM.|track identifies each item to avoid recreating the DOM.
N|Que fait @defer ?|What does @defer do?|Charge un bloc du template à la demande selon un déclencheur~Supprime le composant~Exécute un effet~Bloque le rendu|Lazily loads a template block based on a trigger~Deletes the component~Runs an effect~Blocks rendering|Déclencheurs : on viewport, on idle, on interaction, when.|Triggers: on viewport, on idle, on interaction, when.
N|Comment charger une route seulement quand on la visite ?|How do you load a route only when it is visited?|loadComponent: () => import('./page').then(m => m.Page)~component: Page directement~providers: []~redirectTo|loadComponent: () => import('./page').then(m => m.Page)~component: Page directly~providers: []~redirectTo|Le code est découpé en un chunk chargé à la demande.|The code is split into a chunk loaded on demand.
N|À quoi sert un guard fonctionnel (CanActivateFn) ?|What is a functional guard (CanActivateFn) for?|Autoriser ou bloquer l'accès à une route~Styliser un composant~Compresser le bundle~Valider un pipe|Allow or block access to a route~Style a component~Compress the bundle~Validate a pipe|Il renvoie un booléen ou un UrlTree pour rediriger.|It returns a boolean or a UrlTree to redirect.
N|Comment ajouter un jeton JWT à toutes les requêtes HTTP ?|How do you add a JWT to every HTTP request?|Un intercepteur fonctionnel avec provideHttpClient(withInterceptors([...]))~Modifier chaque composant~Le mettre dans l'URL~Dans le HTML|A functional interceptor with provideHttpClient(withInterceptors([...]))~Edit every component~Put it in the URL~In the HTML|On clone la requête car HttpRequest est immuable.|You clone the request because HttpRequest is immutable.
N|Que signifie le mode zoneless ?|What does zoneless mode mean?|Angular fonctionne sans zone.js, via signaux et événements~Angular n'a plus de composants~Plus de routage~Plus de TypeScript|Angular runs without zone.js, via signals and events~No more components~No more routing~No more TypeScript|Bundle plus léger et détection plus précise.|Lighter bundle and more precise detection.
N|Quel exécuteur de tests est utilisé par défaut dans les projets Angular récents ?|Which test runner is the default in recent Angular projects?|Vitest~Karma~Mocha~Protractor|Vitest~Karma~Mocha~Protractor|Karma et Protractor sont abandonnés.|Karma and Protractor are deprecated.
G|Quelle fonction crée un signal modifiable ?|Which function creates a writable signal?|signal()~computed()~effect()~input()|signal()~computed()~effect()~input()|computed() est en lecture seule et dérive d'autres signaux.|computed() is read-only and derives from other signals.
G|À quoi sert computed() ?|What is computed() for?|Dériver une valeur d'autres signaux, recalculée seulement si nécessaire~Faire un appel HTTP~Écrire dans le DOM~Créer une route|Derive a value from other signals, recalculated only when needed~Make an HTTP call~Write to the DOM~Create a route|Il est paresseux et mémoïsé.|It is lazy and memoized.
G|Quand utiliser linkedSignal ?|When should you use linkedSignal?|Pour un état local qui se réinitialise quand sa source change~Pour remplacer HttpClient~Pour lancer un test~Pour typer une route|For local state that resets when its source changes~To replace HttpClient~To run a test~To type a route|Exemple : une sélection remise à zéro quand la liste change.|Example: a selection reset when the list changes.
G|Que fournit httpResource ?|What does httpResource provide?|Un chargement HTTP réactif avec value, status et error en signaux~La compilation du projet~Le chiffrement des cookies~Le remplacement total de RxJS|Reactive HTTP loading with value, status and error as signals~Project compilation~Cookie encryption~A full replacement for RxJS|Il se relance quand les signaux de sa requête changent.|It reloads when the signals in its request change.
